name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The project targets JVM 25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Chaquopy (yt-dlp) needs a matching Python on the build machine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # The bundled gradle-wrapper.jar is not a working wrapper, so use a real Gradle install
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vitune-debug-apk
          path: app/build/outputs/apk/debug/*.apk
